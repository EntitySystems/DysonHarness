name: Continuous release

on:
  push:
    branches: [master, release-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    # Defense in depth: push is already branch-filtered; also block workflow_dispatch on other refs.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release-preview'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
      short_sha: ${{ steps.calver.outputs.short_sha }}
      channel: ${{ steps.calver.outputs.channel }}
    steps:
      - name: Compute CalVer + channel
        id: calver
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$((10#$(date -u +%m)))
          VERSION="${YEAR}.${MONTH}.${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            CHANNEL="stable"
          else
            CHANNEL="preview"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION} InformationalVersion=${VERSION}+${SHORT_SHA} channel=${CHANNEL}"

  test:
    name: Test (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test src/Harness/Harness.Tests/Harness.Tests.csproj -c Release --nologo

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          # Cross-published from the x64 Windows runner. CefSharp ships chromiumembeddedframework.runtime.win-arm64.
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          # macos-13 retired Dec 2025; cross-publish osx-x64 from arm64 macOS.
          # The macOS shell's Swift dylib is compiled with swiftc -target x86_64-apple-macos14 on that runner.
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHORT_SHA: ${{ needs.version.outputs.short_sha }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/publish/${{ matrix.rid }}"
          mkdir -p "$OUT"
          PROJECT="src/Harness/Harness.UI/Harness.UI.csproj"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            PROJECT="src/Harness/DysonHarness.UI.Windows/DysonHarness.UI.Windows.csproj"
          elif [[ "${{ matrix.rid }}" == osx-* ]]; then
            PROJECT="src/Harness/DysonHarness.UI.macOS/DysonHarness.UI.macOS.csproj"
          fi
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:SelfContained=true \
            -p:PublishSingleFile=false \
            -p:Version="${VERSION}" \
            -p:InformationalVersion="${VERSION}+${SHORT_SHA}" \
            -p:DysonReleaseChannel="${CHANNEL}" \
            -o "$OUT"
          # MIT attribution for ported CLIProxyAPI code must travel with every copy (zip + MSI + pkg payload).
          cp LICENSE THIRD-PARTY-NOTICES.md "$OUT/"

      - name: Import Apple signing keychain
        id: signing
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_TEAM_ID APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            echo "Missing repository secrets: ${missing[*]}" >&2
            echo "Add them under Settings → Secrets and variables → Actions before publishing macOS packages." >&2
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/dyson-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          umask 077
          printf '%s' "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain.password"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g' > "$RUNNER_TEMP/keychains-before.txt"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$RUNNER_TEMP/keychains-before.txt")

          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          if ! printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | tr -d ' \n\r\t' | base64 -D > "$RUNNER_TEMP/certs.p12"; then
            echo "APPLE_CERTIFICATE_P12_BASE64 is not valid base64. Copy it with pbcopy, not from the terminal scrollback." >&2
            exit 1
          fi
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certs.p12"

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)"/\1/p' | head -1)"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer:[^"]*\)"/\1/p' | head -1)"
          if [[ -z "$APP_IDENTITY" || -z "$INSTALLER_IDENTITY" ]]; then
            echo "The p12 must contain both a Developer ID Application identity and a Developer ID Installer identity." >&2
            security find-identity -v "$KEYCHAIN" | sed 's/.*"\([^"]*\)".*/\1/' >&2 || true
            exit 1
          fi
          if [[ "$APP_IDENTITY" != *"($APPLE_TEAM_ID)" || "$INSTALLER_IDENTITY" != *"($APPLE_TEAM_ID)" ]]; then
            echo "Certificate team id does not match APPLE_TEAM_ID." >&2
            echo "Application: $APP_IDENTITY" >&2
            echo "Installer: $INSTALLER_IDENTITY" >&2
            exit 1
          fi
          echo "Signing with: $APP_IDENTITY"
          echo "Packaging with: $INSTALLER_IDENTITY"
          {
            echo "app_identity<<EOF"
            echo "$APP_IDENTITY"
            echo "EOF"
            echo "installer_identity<<EOF"
            echo "$INSTALLER_IDENTITY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bundle and sign macOS app
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.app_identity }}
          CODESIGN_KEYCHAIN: ${{ runner.temp }}/dyson-signing.keychain-db
        run: |
          set -euo pipefail
          security unlock-keychain -p "$(cat "$RUNNER_TEMP/keychain.password")" "$CODESIGN_KEYCHAIN"
          bash scripts/bundle-macos-app.sh "artifacts/publish/${{ matrix.rid }}"

      - name: Notarize macOS app
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          APP="Dyson Harness.app"
          if [[ "${CHANNEL}" == "preview" ]]; then APP="Dyson Harness (Preview).app"; fi
          bash scripts/notarize-macos.sh "artifacts/publish/${{ matrix.rid }}/$APP"

      - name: Zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          ZIP_NAME="DysonHarness-${VERSION}-${RID}.zip"
          mkdir -p artifacts
          if [[ "$RID" == osx-* ]]; then
            # ditto keeps the stapled notarization ticket. zip(1) drops it.
            APP="Dyson Harness.app"
            if [[ "${CHANNEL}" == "preview" ]]; then APP="Dyson Harness (Preview).app"; fi
            ditto -c -k --keepParent "artifacts/publish/${RID}/$APP" "artifacts/${ZIP_NAME}"
          else
            (cd "artifacts/publish/${RID}" && zip -r "../../${ZIP_NAME}" .)
          fi

      - name: Import Azure signing certificate
        if: startsWith(matrix.rid, 'win-')
        id: azure-cert
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_CERTIFICATE_PEM: ${{ secrets.AZURE_CLIENT_CERTIFICATE_PEM }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT || secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT || secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE || secrets.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $missing = @()
          foreach ($name in @(
            'AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_CERTIFICATE_PEM',
            'ARTIFACT_SIGNING_ENDPOINT','ARTIFACT_SIGNING_ACCOUNT','ARTIFACT_SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { $missing += $name }
          }
          if ($missing.Count) {
            throw "Missing repository secrets or variables (the three ARTIFACT_SIGNING_* settings may be a variable or a secret): $($missing -join ', '). Add them before publishing Windows MSIs."
          }
          $pem = Join-Path $env:RUNNER_TEMP 'azure-signing.pem'
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [IO.File]::WriteAllText($pem, $env:AZURE_CLIENT_CERTIFICATE_PEM, $utf8)
          "pem=$pem" >> $env:GITHUB_OUTPUT

      - name: List unsigned files
        id: unsigned
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $root = (Resolve-Path "artifacts/publish/${{ matrix.rid }}").Path
          $paths = @( & scripts/list-unsigned-pe.ps1 -Root $root )
          "count=$($paths.Count)" >> $env:GITHUB_OUTPUT
          "files<<EOF" >> $env:GITHUB_OUTPUT
          $paths | ForEach-Object { $_ >> $env:GITHUB_OUTPUT }
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Sign publish folder
        if: startsWith(matrix.rid, 'win-') && steps.unsigned.outputs.count != '0'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT || secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT || secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE || secrets.ARTIFACT_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-certificate-path: ${{ steps.azure-cert.outputs.pem }}
          files: ${{ steps.unsigned.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          cache-dependencies: false

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zipName = "DysonHarness-$env:VERSION-$rid.zip"
          Compress-Archive -Path "artifacts/publish/$rid/*" -DestinationPath "artifacts/$zipName" -Force

      - name: Build MSI (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $arch = $rid.Substring(4)
          $publishDir = (Resolve-Path "artifacts/publish/$rid").Path
          # MSI ProductVersion requires major < 256; map CalVer YYYY.M.N → (YYYY%100).M.N
          $parts = $env:VERSION -split '\.'
          if ($parts.Count -lt 3) { throw "Unexpected VERSION '$env:VERSION' (want YYYY.M.N)" }
          $msiProductVersion = "{0}.{1}.{2}" -f ([int]$parts[0] % 100), [int]$parts[1], [int]$parts[2]
          Write-Host "CalVer=$env:VERSION MSI ProductVersion=$msiProductVersion channel=$env:CHANNEL arch=$arch"
          dotnet build packaging/wix/DysonHarness.Installer.wixproj -c Release `
            -p:Version=$env:VERSION `
            -p:ProductVersion=$msiProductVersion `
            -p:InstallerArch=$arch `
            -p:PublishDir=$publishDir
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI build failed with exit $LASTEXITCODE" }
          $msi = Get-ChildItem -Path packaging/wix/bin -Recurse -Filter "DysonHarness-$env:VERSION-$rid.msi" |
            Select-Object -First 1
          if (-not $msi) {
            throw "MSI not found under packaging/wix/bin for version $env:VERSION rid $rid"
          }
          Copy-Item $msi.FullName "artifacts/$($msi.Name)" -Force
          Write-Host "Copied MSI to artifacts/$($msi.Name)"

      - name: Sign MSI
        if: startsWith(matrix.rid, 'win-')
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT || secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT || secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE || secrets.ARTIFACT_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-certificate-path: ${{ steps.azure-cert.outputs.pem }}
          files: ${{ github.workspace }}\artifacts\DysonHarness-${{ env.VERSION }}-${{ matrix.rid }}.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          cache-dependencies: false

      - name: Verify Authenticode
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $msi = "artifacts/DysonHarness-$env:VERSION-${{ matrix.rid }}.msi"
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid') { throw "MSI signature $($sig.Status): $msi" }
          $root = (Resolve-Path "artifacts/publish/${{ matrix.rid }}").Path
          $bad = @( & scripts/list-unsigned-pe.ps1 -Root $root )
          if ($bad.Count) { throw "Still unsigned: $($bad -join ', ')" }
          Write-Host "Verified MSI and inner files."

      - name: Verify MSI payload signatures
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          # Administrative extract copies the packaged file bytes as-is; every PE inside must be Valid.
          $msi = (Resolve-Path "artifacts/DysonHarness-$env:VERSION-${{ matrix.rid }}.msi").Path
          $dest = Join-Path $env:RUNNER_TEMP "msi-extract-${{ matrix.rid }}"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $dest
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dest`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed with exit $($p.ExitCode)" }
          $pe = @(Get-ChildItem -LiteralPath $dest -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          if (-not $pe.Count) { throw "No .exe/.dll extracted from $msi" }
          $bad = @( & scripts/list-unsigned-pe.ps1 -Root $dest )
          if ($bad.Count) { throw "Unsigned inside MSI ($($bad.Count) of $($pe.Count)): $($bad -join ', ')" }
          Write-Host "All $($pe.Count) PE files inside the MSI are Valid."
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $dest

      - name: Remove Azure signing certificate
        if: always() && startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'azure-signing.pem')

      - name: Build macOS pkg
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$(cat "$RUNNER_TEMP/keychain.password")" "$RUNNER_TEMP/dyson-signing.keychain-db"
          APP="Dyson Harness.app"
          if [[ "${CHANNEL}" == "preview" ]]; then APP="Dyson Harness (Preview).app"; fi
          bash scripts/package-macos-pkg.sh \
            "artifacts/publish/${{ matrix.rid }}/$APP" \
            "artifacts/DysonHarness-${VERSION}-${{ matrix.rid }}.pkg" \
            "$VERSION" \
            "${{ steps.signing.outputs.installer_identity }}"

      - name: Notarize macOS pkg
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash scripts/notarize-macos.sh "artifacts/DysonHarness-${VERSION}-${{ matrix.rid }}.pkg"

      - name: Remove signing keychain
        if: always() && startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/dyson-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certs.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$RUNNER_TEMP/keychain.password"
          if [[ -f "$RUNNER_TEMP/keychains-before.txt" ]]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains-before.txt") || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DysonHarness-${{ env.VERSION }}-${{ matrix.rid }}
          path: artifacts/DysonHarness-${{ env.VERSION }}-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, publish]
    concurrency:
      group: continuous-release-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHORT_SHA: ${{ needs.version.outputs.short_sha }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      # gh release create needs a git checkout to create/move the tag.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: DysonHarness-${{ env.VERSION }}-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      # Immutable releases burn each tag forever after publish — use unique CalVer tags.
      - name: Publish continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/DysonHarness-*.zip release-assets/DysonHarness-*.msi release-assets/DysonHarness-*.pkg)
          if (( ${#assets[@]} == 0 )); then
            echo "No zip/MSI assets under release-assets/" >&2
            exit 1
          fi
          echo "Assets to publish:"
          ls -la "${assets[@]}"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; refusing to overwrite immutable tag" >&2
            exit 1
          fi

          if [[ "${CHANNEL}" == "stable" ]]; then
            TRACK_LABEL="Stable"
            NOTES_BLURB="Stable continuous build of DysonHarness (self-contained)."
          else
            TRACK_LABEL="Preview"
            NOTES_BLURB="Preview continuous build of DysonHarness (self-contained, pre-release)."
          fi

          cat > "${RUNNER_TEMP}/continuous-notes.md" <<EOF
          ${NOTES_BLURB}

          | | |
          |---|---|
          | **Version** | \`${VERSION}\` |
          | **Channel** | \`${CHANNEL}\` |
          | **Commit** | \`${GITHUB_SHA}\` (\`${SHORT_SHA}\`) |
          | **Workflow** | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          **Windows:** prefer the MSI for a per-user install (Start Menu shortcut + Apps & Features as **Dyson Harness**, manufacturer **Entity Systems**). \`DysonHarness-${VERSION}-win-x64.msi\` is the existing x64 install. \`DysonHarness-${VERSION}-win-arm64.msi\` is a separate ARM64 install (its own upgrade code and \`%LocalAppData%\\Programs\\DysonHarness-arm64\`). Zips remain portable. Each MSI needs the matching VC++ 2022 redistributable (x64 or ARM64). An x64 install running under emulation on an ARM device stays on the x64 MSI. **Linux:** unzip and run \`Harness.UI\`. **macOS:** install \`DysonHarness-${VERSION}-osx-arm64.pkg\` (Apple Silicon) or \`DysonHarness-${VERSION}-osx-x64.pkg\` (Intel). The package is Developer ID signed and notarized. A stable package installs **Dyson Harness** (\`/Applications/Dyson Harness.app\`); a preview package installs **Dyson Harness (Preview)** (\`/Applications/Dyson Harness (Preview).app\`). The zip is that same stapled app. See [docs/packaging/releases.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/docs/packaging/releases.md).
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/continuous-notes.md"

          PRERELEASE_ARGS=()
          if [[ "${CHANNEL}" == "preview" ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          echo "Creating ${CHANNEL} release ${VERSION}"
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${TRACK_LABEL} build ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/continuous-notes.md" \
            "${PRERELEASE_ARGS[@]}" \
            "${assets[@]}"

          echo "Published assets:"
          gh release view "${VERSION}" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"'
          zip_count="$(gh release view "${VERSION}" --json assets --jq '[.assets[] | select(.name | endswith(".zip"))] | length')"
          msi_count="$(gh release view "${VERSION}" --json assets --jq '[.assets[] | select(.name | endswith(".msi"))] | length')"
          pkg_count="$(gh release view "${VERSION}" --json assets --jq '[.assets[] | select(.name | endswith(".pkg"))] | length')"
          if [[ "${zip_count}" -ne 5 ]] || [[ "${msi_count}" -ne 2 ]] || [[ "${pkg_count}" -ne 2 ]]; then
            echo "Expected 5 zips + 2 MSIs + 2 pkgs, found ${zip_count} zips + ${msi_count} MSI + ${pkg_count} pkgs" >&2
            exit 1
          fi

      - name: Retain newest four channel releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "${CHANNEL}" in
            stable)
              is_prerelease=false
              ;;
            preview)
              is_prerelease=true
              ;;
            *)
              echo "Unexpected release channel: ${CHANNEL}" >&2
              exit 1
              ;;
          esac

          releases_json="$(gh release list --limit 100 --json tagName,isPrerelease,publishedAt,isDraft)"
          obsolete_tags="$(
            jq -r --argjson is_prerelease "${is_prerelease}" '
              map(select(.isDraft == false and .isPrerelease == $is_prerelease))
              | sort_by(.publishedAt // "")
              | reverse
              | .[4:]
              | .[].tagName
            ' <<<"${releases_json}"
          )"

          if [[ -z "${obsolete_tags}" ]]; then
            echo "No ${CHANNEL} releases exceed the retention limit."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            echo "Deleting obsolete ${CHANNEL} release ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag
          done <<<"${obsolete_tags}"
