name: Continuous release

on:
  push:
    branches: [master, release-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    # Defense in depth: push is already branch-filtered; also block workflow_dispatch on other refs.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release-preview'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
      short_sha: ${{ steps.calver.outputs.short_sha }}
      channel: ${{ steps.calver.outputs.channel }}
    steps:
      - name: Compute CalVer + channel
        id: calver
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$((10#$(date -u +%m)))
          VERSION="${YEAR}.${MONTH}.${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            CHANNEL="stable"
          else
            CHANNEL="preview"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION} InformationalVersion=${VERSION}+${SHORT_SHA} channel=${CHANNEL}"

  test:
    name: Test (Release)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test src/Harness/Harness.Tests/Harness.Tests.csproj -c Release --nologo

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          # macos-13 retired Dec 2025; cross-publish osx-x64 from arm64 macOS (managed .NET).
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHORT_SHA: ${{ needs.version.outputs.short_sha }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/publish/${{ matrix.rid }}"
          mkdir -p "$OUT"
          PROJECT="src/Harness/Harness.UI/Harness.UI.csproj"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            PROJECT="src/Harness/DysonHarness.UI.Windows/DysonHarness.UI.Windows.csproj"
          fi
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:SelfContained=true \
            -p:PublishSingleFile=false \
            -p:Version="${VERSION}" \
            -p:InformationalVersion="${VERSION}+${SHORT_SHA}" \
            -p:DysonReleaseChannel="${CHANNEL}" \
            -o "$OUT"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zipName = "DysonHarness-$env:VERSION-$rid.zip"
          Compress-Archive -Path "artifacts/publish/$rid/*" -DestinationPath "artifacts/$zipName" -Force

      - name: Zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          ZIP_NAME="DysonHarness-${VERSION}-${RID}.zip"
          mkdir -p artifacts
          (cd "artifacts/publish/${RID}" && zip -r "../../${ZIP_NAME}" .)

      - name: Build MSI (win-x64)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path "artifacts/publish/win-x64").Path
          # MSI ProductVersion requires major < 256; map CalVer YYYY.M.N → (YYYY%100).M.N
          $parts = $env:VERSION -split '\.'
          if ($parts.Count -lt 3) { throw "Unexpected VERSION '$env:VERSION' (want YYYY.M.N)" }
          $msiProductVersion = "{0}.{1}.{2}" -f ([int]$parts[0] % 100), [int]$parts[1], [int]$parts[2]
          Write-Host "CalVer=$env:VERSION MSI ProductVersion=$msiProductVersion channel=$env:CHANNEL"
          dotnet build packaging/wix/DysonHarness.Installer.wixproj -c Release `
            -p:Version=$env:VERSION `
            -p:ProductVersion=$msiProductVersion `
            -p:PublishDir=$publishDir
          if ($LASTEXITCODE -ne 0) { throw "WiX MSI build failed with exit $LASTEXITCODE" }
          $msi = Get-ChildItem -Path packaging/wix/bin -Recurse -Filter "DysonHarness-$env:VERSION-win-x64.msi" |
            Select-Object -First 1
          if (-not $msi) {
            throw "MSI not found under packaging/wix/bin for version $env:VERSION"
          }
          Copy-Item $msi.FullName "artifacts/$($msi.Name)" -Force
          Write-Host "Copied MSI to artifacts/$($msi.Name)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DysonHarness-${{ env.VERSION }}-${{ matrix.rid }}
          path: artifacts/DysonHarness-${{ env.VERSION }}-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, publish]
    concurrency:
      group: continuous-release-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHORT_SHA: ${{ needs.version.outputs.short_sha }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      # gh release create needs a git checkout to create/move the tag.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DysonHarness-${{ env.VERSION }}-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      # Immutable releases burn each tag forever after publish — use unique CalVer tags.
      - name: Publish continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/DysonHarness-*.zip release-assets/DysonHarness-*.msi)
          if (( ${#assets[@]} == 0 )); then
            echo "No zip/MSI assets under release-assets/" >&2
            exit 1
          fi
          echo "Assets to publish:"
          ls -la "${assets[@]}"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; refusing to overwrite immutable tag" >&2
            exit 1
          fi

          if [[ "${CHANNEL}" == "stable" ]]; then
            TRACK_LABEL="Stable"
            NOTES_BLURB="Stable continuous build of DysonHarness (self-contained)."
          else
            TRACK_LABEL="Preview"
            NOTES_BLURB="Preview continuous build of DysonHarness (self-contained, pre-release)."
          fi

          cat > "${RUNNER_TEMP}/continuous-notes.md" <<EOF
          ${NOTES_BLURB}

          | | |
          |---|---|
          | **Version** | \`${VERSION}\` |
          | **Channel** | \`${CHANNEL}\` |
          | **Commit** | \`${GITHUB_SHA}\` (\`${SHORT_SHA}\`) |
          | **Workflow** | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          **Windows:** prefer the MSI (\`DysonHarness-${VERSION}-win-x64.msi\`) for a per-user install (Start Menu shortcut + Apps & Features as **Dyson Harness**, manufacturer **Entity Systems**); zip remains portable. VC++ 2022 x64 redistributable required. **Linux / macOS:** unzip and run \`Harness.UI\`. See [docs/packaging/releases.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/docs/packaging/releases.md).
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/continuous-notes.md"

          PRERELEASE_ARGS=()
          if [[ "${CHANNEL}" == "preview" ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          echo "Creating ${CHANNEL} release ${VERSION}"
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${TRACK_LABEL} build ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/continuous-notes.md" \
            "${PRERELEASE_ARGS[@]}" \
            "${assets[@]}"

          echo "Published assets:"
          gh release view "${VERSION}" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"'
          zip_count="$(gh release view "${VERSION}" --json assets --jq '[.assets[] | select(.name | endswith(".zip"))] | length')"
          msi_count="$(gh release view "${VERSION}" --json assets --jq '[.assets[] | select(.name | endswith(".msi"))] | length')"
          if [[ "${zip_count}" -ne 4 ]] || [[ "${msi_count}" -ne 1 ]]; then
            echo "Expected 4 zips + 1 MSI, found ${zip_count} zips + ${msi_count} MSI" >&2
            exit 1
          fi

      - name: Retain newest four channel releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "${CHANNEL}" in
            stable)
              is_prerelease=false
              ;;
            preview)
              is_prerelease=true
              ;;
            *)
              echo "Unexpected release channel: ${CHANNEL}" >&2
              exit 1
              ;;
          esac

          releases_json="$(gh release list --limit 100 --json tagName,isPrerelease,publishedAt,isDraft)"
          obsolete_tags="$(
            jq -r --argjson is_prerelease "${is_prerelease}" '
              map(select(.isDraft == false and .isPrerelease == $is_prerelease))
              | sort_by(.publishedAt // "")
              | reverse
              | .[4:]
              | .[].tagName
            ' <<<"${releases_json}"
          )"

          if [[ -z "${obsolete_tags}" ]]; then
            echo "No ${CHANNEL} releases exceed the retention limit."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            echo "Deleting obsolete ${CHANNEL} release ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag
          done <<<"${obsolete_tags}"
