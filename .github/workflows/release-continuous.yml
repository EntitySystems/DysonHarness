name: Continuous release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calver.outputs.version }}
      short_sha: ${{ steps.calver.outputs.short_sha }}
    steps:
      - name: Compute CalVer
        id: calver
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$((10#$(date -u +%m)))
          VERSION="${YEAR}.${MONTH}.${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION} InformationalVersion=${VERSION}+${SHORT_SHA}"

  test:
    name: Test (Release)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test src/Harness/Harness.Tests/Harness.Tests.csproj -c Release --nologo

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          # macos-13 retired Dec 2025; cross-publish osx-x64 from arm64 macOS (managed .NET).
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHORT_SHA: ${{ needs.version.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/publish/${{ matrix.rid }}"
          mkdir -p "$OUT"
          PROJECT="src/Harness/Harness.UI/Harness.UI.csproj"
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            PROJECT="src/Harness/DysonHarness.UI.Windows/DysonHarness.UI.Windows.csproj"
          fi
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:SelfContained=true \
            -p:PublishSingleFile=false \
            -p:Version="${VERSION}" \
            -p:InformationalVersion="${VERSION}+${SHORT_SHA}" \
            -o "$OUT"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zipName = "DysonHarness-$env:VERSION-$rid.zip"
          Compress-Archive -Path "artifacts/publish/$rid/*" -DestinationPath "artifacts/$zipName" -Force

      - name: Zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          ZIP_NAME="DysonHarness-${VERSION}-${RID}.zip"
          mkdir -p artifacts
          (cd "artifacts/publish/${RID}" && zip -r "../../${ZIP_NAME}" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DysonHarness-${{ env.VERSION }}-${{ matrix.rid }}
          path: artifacts/DysonHarness-${{ env.VERSION }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Continuous pre-release
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHORT_SHA: ${{ needs.version.outputs.short_sha }}
    steps:
      # gh release create needs a git checkout to create/move the tag.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DysonHarness-${{ env.VERSION }}-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      # Immutable releases burn each tag forever after publish — use unique CalVer tags.
      - name: Publish continuous pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/DysonHarness-*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "No zip assets under release-assets/" >&2
            exit 1
          fi
          echo "Assets to publish:"
          ls -la "${assets[@]}"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; refusing to overwrite immutable tag" >&2
            exit 1
          fi

          cat > "${RUNNER_TEMP}/continuous-notes.md" <<EOF
          Continuous build of DysonHarness (self-contained).

          | | |
          |---|---|
          | **Version** | \`${VERSION}\` |
          | **Commit** | \`${GITHUB_SHA}\` (\`${SHORT_SHA}\`) |
          | **Workflow** | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          **Windows:** unzip and run \`DysonHarness.exe\` (CefSharp WPF shell). **Linux / macOS:** run \`Harness.UI\`. See [docs/packaging/releases.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/docs/packaging/releases.md).
          EOF
          sed -i 's/^          //' "${RUNNER_TEMP}/continuous-notes.md"

          echo "Creating pre-release ${VERSION}"
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Continuous build ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/continuous-notes.md" \
            --prerelease \
            "${assets[@]}"

          echo "Published assets:"
          gh release view "${VERSION}" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"'
          count="$(gh release view "${VERSION}" --json assets --jq '.assets | length')"
          if [[ "${count}" -lt 4 ]]; then
            echo "Expected 4 RID zips, found ${count}" >&2
            exit 1
          fi
